        LigningsmæssigtFradragUdenlandskExemption:
          description: |-
            Felt 414: Ligningsmæssige fradrag vedr. udenlandsk lønindkomst (UDLLFRDFBUNFRDBLB)
            Feltet indberettes med ligningsmæssige fradrag, der vedrører felt 281 (udenlandsk indkomst som efter LL § 33A, stk. 1, er omfattet af reglerne om ny exemption).
            Følgende ligningsmæssige fradrag skal indberettes i feltet:
            - Standardfradrag ved lønarbejde i udlandet
            - Lønmodtagerudgifter svarende til dem, der indberettes i felt 449 (øvrige lønmodtagerudgifter).
            Danske faglige kontingenter indgår i felt 458 og felt 570 og indberettes derfor ikke i felt 414 - heller ikke den del, der forholdsmæssigt kan henføres til udenlandsk personlig indkomst.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningmæssigtFradragUdenlandskCredit:
