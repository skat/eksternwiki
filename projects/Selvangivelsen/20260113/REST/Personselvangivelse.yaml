          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningsmæssigtFradragLøbendeYdelserForeninger:
          description: |-
            Felt 448: Løbende ydelser til godkendte foreninger LL § 12, stk. 3 (FENINLOEYDSBLB)
            Feltet indeholder indberettede oplysninger om gaver til danske og udenlandske godkendte fonde og foreninger mv. (ligningslovens § 12, stk. 3).
            Det er en betingelse for fradrag, at foreningen har indberettet gaven.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningsmæssigtFradragMedarbejdendeÆgtefælleSygeArbejdsskadeForsikring:
          description: |-
            Felt 497: Fradrag for syge- og arbejdsskadeforsikringer for medarbejdende ægtefælle (MABAEGFSIFRDBLB)
            Selvstændige erhvervsdrivende og deres medarbejdende ægtefæller kan fratrække udgifter til præmiebetalinger til syge- og arbejdsskadeforsikringer.
            Der er for 2014 oprettet et nyt felt til medarbejdende ægtefællers fradrag.
            Feltet er et ligningsmæssigt fradrag.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningsmæssigtFradragRejseUdgifter:
          description: |-
            Felt 429: Rejseudgifter (fradrag for kost og logi på rejser, højst årets loft) (RJSUDGBLB)
            I feltet angives fradrag for rejseudgifter, dog maksimalt årets loft. Loftet reguleres efter PSL § 20, og gælder både lønmodtagere og selvstændigt erhvervsdrivende.
            Beløbet i rubrikken skal omfatte udgifter til logi, kost og småfornødenheder, som ikke er dækket af skattefri rejsegodtgørelse.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningsmæssigtFradragUdgifterFrededeBygninger:
          description: |-
            Felt 456: Fredede bygninger (FREEJDUDGBLB)
            I feltet indgår beregnet fradrag, der er indberettet af Bygnings frednings foreningen (BYFO).
            I felt 456 tastes fradragsberettigede udgifter til fredede bygninger, jf. bygningsfredningsloven og LL § 15 K.
            Beløbet er et ligningsmæssigt fradrag og behandles som et engangsbeløb ved delårsansættelse.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningsmæssigtFradragUdgifterNytServiceFradrag:
          description: |-
            Felt 461: Servicefradrag - højst 25.000 kr. (SRVICFRD2BLB)
            Beløbet omfatter udgifter til arbejdsløn for serviceydelser på op til maksimumfradrag (inkl. eventuel moms).
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningsmæssigtFradragUdgifterHåndværkerFradrag:
          description: Beløbet omfatter udgifter til arbejdsløn for håndværksydelser på op til maksimumfradrag (inkl. eventuel moms).
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningsmæssigtFradragUnderholdsBidragBørneBidrag:
          description: |-
            Felt 411: Underholdsbidrag til tidl. ægtefælle og børnebidrag. Aftægtsforpligtelser mv. (UNHBIDFRDBLB)
            Felt 411 indberettes med børne-/underholdsbidrag og aftægsforpligtelse. C.A.8.5
            Beløbet i rubrikken skal indeholde fradragsberettigede udgifter til:
            - Børnebidrag
            - Underholdsbidrag (til tidligere ægtefælle)
            - Aftægtsforpligtelse og underholdsydelser
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningsmæssigtFradragØvrigeLønmodtagerUdgifter:
          description: |-
            Felt 449: Øvrige lønmodtagerudgifter (OEVLOEMOTFRDBLB)
            Felt 449 indberettes med øvrige lønmodtagerudgifter, i det omfang disse udgifter overstiger 5.800 kr. (2016).
            Hvis der samtidig med øvrige lønmodtagerudgifter for dansk indkomst, er lønmodtagerudgifter vedrørende udenlandsk indkomst, der er omfattet af grænsen på 5.800 kr. (2016) skal de 5.800 kr. først og fremmest modregnes i fradraget i den udenlandske indkomst.
            Der skal ikke modregnes 5.800 kr. (2016) begge steder.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningsmæssigtFradragJobFradragBeløb:
          description: |-
            Felt 032: Jobfradrag (JOBFRD2BLB)
            Ved L238 er der blevet indført et jobfradrag målrettet de laveste arbejdsindkomster. Jobfradraget beregnes af samme grundlag, som der beregnes alm. beskæftigelsesfradrag af (felt 400).
            Der er tale om præcis samme personkreds, som der er berettiget til det almindelige beskæftigelsesfradrag.
            Jobfradrag beregnes som 2,5% (årsvariabel) af den del af beregningsgrundlaget, der overstiger en bundgrænse på 187.500 kr. (årsvariabel). Fradraget kan dog max. udgøre 1.400 kr. (årsvariabel)
            Hvis beregningen medfører, at fradraget er negativt, sættes fradraget til kr. 0.
            Grundbeløb og max.beløb reguleres efter PSL §20.
            Jobfradraget er et ligningsmæssigt fradrag.
            Delår
            I forbindelse med delårsomregning beregnes fradrag på baggrund af periodens indkomster og omregnes på almindelig vis til helårsbeløb sammen med de øvrige ligningsmæssige fradrag. Jobfradraget må dog hverken på periode eller helårsbasis udgøre mere end 1.400 kr. (2018-beløb).
            Udenlandske beløb
            Der er ikke tale om et fradrag for udgifter forbundet med selve erhvervelsen af indkomsten. Det betyder, at den del af jobfradraget, som beregnes af bidragspligtig udenlandsk indkomst, ikke vil reducere den udenlandske indkomst i eksempelvis de tilfælde, hvor der skal beregnes lempelse ved beskatning af den udenlandske indkomst her i landet.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningsmæssigtFradragEkstraPensionsfradragBeløb:
          description: "Ligningsmæssigt fradrag for indbetalinger på pensionsordninger (Felt 344).\nFradragssats\tGrundbeløb\tPersongruppe\n8%\t\t70.000\t\tPersoner >15 år til pensionsalder\n20%\t\t70.000\t\tPersoner <=15 år til pensionsalder\n(Grundbeløbet (2018 niveau) reguleres årligt jf. §20 i Personskatteloven)\n"
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningsmæssigtFradragSøfradrag:
          description: |-
            Felt 450: Søfradrag (SOEUDRFARFRDBLB)
            Søfradrag i felt 450 beregnes automatisk. Der er tale om et standardfradrag for sømænd (undtaget sømænd med DIS-indkomst, begrænset fart) på 56.900 kr.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningsmæssigtFradragDISFradragAndenFart:
          description: |-
            Felt 453: Fradrag i DIS-indkomst, anden fart (SOEDISFRDBLB)
            Fradraget vedrører sømænd med indkomst i felt 506, DIS-indkomst, anden fart. De får beregnet et standardfradrag, DIS-fradrag, anden fart i felt 453, hvis ikke der indberettes manuelt i feltet. Der er tale om et standardfradrag for sømænd (undtaget sømænd med DIS-indkomst, begrænset fart) på 56.900 kr.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        LigningsmæssigtFradragEfterlønsbidragGrænsegænger:
          description: |
            Felt 401: Arbejdsløshedsforsikring + bidrag til efterlønsordning og flexydelse
            Bidrag til efterløn/fleksydelse, grænsegænger.
            Vær opmærksom på at efterlønsbidrag og flexydelse bliver opsat automatisk i felt 439. Indtil videre skal beløbet blive stående i felt 439.
            Feltet kan alene indberettes for grænsegængere omfattet af KSL, afsnit 1A.
            Såfremt skatteyder bliver beskattet som grænsegænger (KSL afsnit 1A), er der fradragsret for indbetalinger til A-kasse og bidrag til efterlønsordning/fleksydelse. Der er fradrag for såvel frivillige som tvungne indbetalinger til såvel danske som udenlandske arbejdsløshedsordninger.
            Selvstændige erhvervsdrivende, der betaler til Selvstændige Erhvervsdrivendes Arbejdsløshedskasse eller lignende, vil også kunne få fradrag.
            For dobbeltdomicilerede grænsegængere, grænsegængerkode lig 2 eller 6, skal indbetaling til arbejdsløshedskasse/bidrag til efterlønsordning/fleksydelse indberettes i felt 401 fremfor i felt 439 (A-kassebidrag).
            Hvis der er fradragsberettiget fagligt kontingent skal dette i felt 458 (fagligt kontingent).
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
