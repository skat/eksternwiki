      properties:
        ArbejdsgiverAdministreretBidragIndskudAldersopsparingDISBeløb:
          description: Angiver indskud på arbejdsgiveradministreret aldersopsparing, gruppeliv mv. fratrukket løn, vedr. DIS-indkomst.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        ArbejdsgiverAdministreretBidragIndskudPåAlderpension:
          description: |-
            Felt 347: Indskud på arbejdsgiveradministreret aldersopsparing, gruppeliv mv., fratrukket i din løn (ARBALDPENSBLB)
            Feltet bruges til arbejdsgiveradministrerede aldersopsparinger, gruppeliv og sundhedsforsikringer, hvor der er bortset fra indbetalingen.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        KunstnerVirksomhedOrdningBeløbOverførtFraKonto:
          description: |-
            Felt 220: Overført fra konto for udligning for kunstnere i virksomhed (KUNVIRHAEINDBLB)
            Beløbet udgør hævning efter reglerne i indkomstudligningsordningen for kunstnere, jf. virksomhedsskatteloven § 22d.
            Beløbet skal være tillagt den til hævningen svarende indkomstudligningskat.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        KunstnerVirksomhedOrdningIndkomstTilBeskatning:
          description: |-
            Felt 424: Indkomst til beskatning efter udligningsordningen for kunstnere i virksomhed (KUNVIROPSINDBLB)
            I felt 424 indberettes erhvervsdrivendes henlæggelse efter reglerne i indkomstudligningsordningen for kunstnere, jf. VSL § 22 d.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        MedarbejdendeÆgtefælleIndkomst:
          description: INDKOMST SOM MEDARBEJDENDE ÆGTEFÆLLE
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        MedarbejdendeÆgtefælleIndkomstEfterAMBidrag:
          description: Operationelt beregningsfelt, som indeholder MedarbejdendeÆgtefælleIndkomst efter arbejdsmarkedsbidrag (AM-bidrag) er fratrukket.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstØvrigeFradragPersonligIndkomst:
          description: |-
            Beløb der udgør fradragsberettigede udgifter til erhvervsmæssig befordring, som er omtalt i vejledningen Få godtgørelse eller fradrag for din erhvervsmæssige kørsel.
            Rubrik: 29 Felt: 425
          type: number
          x-typeDescription: Beløb angivet som decimaltal, fx. 1500,00
        PersonligIndkomstAndenPersonligIndkomst:
          description: |-
            Felt 250: Anden personlig indkomst, herunder mindre personalegoder med samlet værdi over 1.000 kr. (Rubrik 20) (ANDPERSINDKBLB)
            I rubrikken skal oplyses lønindkomster, der ikke indgår i andre rubrikker. Skriv det samlede beløb uden at trække arbejdsmarkedsbidrag fra.
            Beløbet i rubrikken skal blandt andet omfatte:
            - Værdien af fri sommerbolig i udlandet (værdien af fri sommerbolig i Danmark indgår i rubrik 17).
            - Værdien af kost og logi.
            - Mindre personalegoder (med en værdi under bagatelgrænsen), men hvor de har en samlet værdi på over bagatelgrænsen (grundbeløb i 2010-niveau 1.000 kr.).
            - Ferierejser betalt af angiverens arbejdsgiver (gælder også ferierejser, der kombineres med en forretningsrejse).
            - Legater.
            - Anden personlig indkomst fx mindre personalegoder, langtidsudlejning af leje- eller andelsbolig, indtægter ved udlejning af bil og båd mv.
            - Skattepligtige gevinster ved spil og væddemål.
            - Skattepligtige offentlige tilskud.
            - Indtægt fra vedvarende energianlæg, herunder vindmøller.
            - Fortjeneste ved salg af ædle metaller mv.
            - Genvundne afskrivninger ved salg af bygninger på lejet grund eller ejendom med hjemfaldspligt og lignende.
            - Fortjeneste ved salg af aktiver, hvorpå der er foretaget skattemæssige afskrivninger.
            Bundgrænsen reguleres årligt.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstAndenPersonligIndkomstEfterAMBidrag:
          description: Operationelt beregningsfelt, som indeholder PersonligIndkomstAndenPersonligIndkomst efter arbejdsmarkedsbidrag (AM-bidrag) er fratrukket.
          type: number
          x-typeDescription: Beløb angivet som decimaltal, fx. 1500,00
        PersonligIndkomstEjendomsAvance:
          description: |-
            Beløb der udgør ejendomsavance. Beløbet omfatter avance fra salg af erhvervsejendomme (ejendomsavance). Indgår i den Personlige Indkomst.
            Rubrik: 308 Felt: 308
          type: number
          x-typeDescription: Beløb angivet som decimaltal, fx. 1500,00
        PersonligIndkomstFradragGæsteStuderendeEfter:
          description: |-
            Beløbet i rubrikken skal omfatte:
            - En gæstestuderendes indkomst på op til gæstestuderendefradragsgrænsen fra arbejde i Danmark, hvis personen er begyndt at studere i Danmark. Beløbet skal i nogle situationer reduceres (læs om reglerne i vejledningen Fritagelse for beskatning for gæstestuderende).
            Gæstestuderendefradragsgrænsen fastsættes til samme beløb som personfradraget. Beløbet reguleres årligt.
            Rubrik: 437 Felt: 437
          type: number
          x-typeDescription: Beløb angivet som decimaltal, fx. 1500,00
        PersonligIndkomstFradragGæsteStuderendeFør:
          description: |-
            Beløbet i rubrikken skal omfatte:
            Fradrag på op til 71.000 kr., hvis personen er begyndt at studere i Danmark før 1.1. 2011. Beløbet skal i nogle situationer reduceres (læs om reglerne i vejledningen Fritagelse for beskatning for gæstestuderende).
            Beløbet må ikke være større end den personlige indkomst, herunder lønindkomsten i rubrik 10. Fradraget gives forholdsmæssigt for den del af året man er gæstestuderende her i landet.
            Rubrik: 491 Felt: 491
          type: number
          x-typeDescription: Beløb angivet som decimaltal, fx. 1500,00
        PersonligIndkomstFradragIndskudIværksætterKonto:
          description: |-
            Beløb der udgør årets samlede indskud på angivers særlige iværksætterkonto.
            Rubrik: 27 Felt: 426
          type: number
          x-typeDescription: Beløb angivet som decimaltal, fx. 1500,00
        PersonligIndkomstFradragMedarbejdendeÆgtefælle:
          description: |-
            Beløb der udgør den del af virksomhedsoverskuddet, der skal overføres til beskatning hos medarbejdende ægtefælle.
            Rubrik: 113 Felt: 473
          type: number
          x-typeDescription: Beløb angivet som decimaltal, fx. 1500,00
        PersonligIndkomstFradragUdenlandskeSocialeBidrag:
          description: |-
            Felt 459: Fradrag for udenlandske obligatoriske sociale bidrag (UDLSOCBIDBLB)
            Feltet er et fradrag i den personlige indkomst, der skal fragå i den udenlandske eller danske indkomst, men først efter evt. AM-bidraget er fratrukket.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstGruppeLivsForsikringLegatPersonaleGoder:
          description: |-
            Felt 229: Gruppelivsforsikring via fagforeningen, legater og bestemte personalegoder (Rubrik 17) (HONSTOGRPBLB)
            Beløb der udgør skattepligtige uddelinger fra foreninger og fonde, præmier til gruppelivsforsikring betalt af pensionsselskaber eller lignende, værdien af fri helårsbolig, værdien af fri lystbåd, værdien af fri medielicens, værdien af fri sommerbolig i Danmark, tilbagebetalte præmier til forsikringer, hvor tilbagebetalingen skyldes præmiefritagelse og værdien af personalelån.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstHædersGaver:
          description: |-
            Felt 256: Hædersgaver (Rubrik 18) (HAEGABLB)
            Beløbet i rubrikken består af hædersgaver, dvs. priser, gaver og legater givet som anerkendelse af dine fortjenester (engangsbeløb).
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstHævningEtableringsKonto:
          description: |-
            Felt 215: Hævning af etableringskontomidler til køb af aktier mv. (Rubrik: 137) (OPHETAKTOEFTBLB)
            I felt 215 indberettes genbeskatningsbeløb i forbindelse med hævning af etableringskontomidler til køb af aktier mv. ved etablering af virksomhed i selskabsform, hvorefter der skal ske genbeskatning over 10 år for at udligne tidligere fradrag, jf. § 7, stk. 11, i lov om indskud på etableringskonto og iværksætterkonto.
            Bemærk, at det er årets beløb til genbeskatning og ikke det samlede beløb til genbeskatning, der skal selvangives/indberettes.
            Beløb i felt 215 er AM-bidragsfri engangsbeløb i den personlige indkomst.
            Beløb i felt 215 indgår i indkomstgrundlaget vedrørende reduktion af pensionistnedslag i ejendomsværdiskatten.
            Beløb i felt 215 behandles som engangsbeløb, og det har betydning for skatteberegningen i tilfælde af delårsansættelse efter PSL § 14, stk. 1, for fuldt skattepligtige og efter PSL § 14, stk. 3, for begrænset skattepligtige.
            Efterbeskatningsbeløb vedrørende etableringskonto hævet i utide mv. opsættes/indberettes i felt 530/533.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstHævningIværksætterKonto:
          description: |-
            Felt 235: Hævning af iværksætterkontomidler til køb af aktier mv. (Rubrik 134) (IVSKTOHAEBLB)
            I felt 235 indberettes genbeskatningsbeløb i forbindelse med hævning af iværksætterkontomidler til køb af aktier mv. ved etablering af virksomhed i selskabsform, hvorefter der skal ske genbeskatning over 10 år for at udligne tidligere fradrag, jf. § 7, stk. 11, i lov om indskud på etableringskonto og iværksætterkonto.
            Bemærk, at det er årets beløb til genbeskatning og ikke det samlede beløb til genbeskatning, der skal selvangives/indberettes.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstHonorar:
          description: |-
            Felt 210: Honorarer og vederlag i form af visse goder mv. før fradrag af AM-bidrag (HONSTIINDKBLB)
            Beløb der udgør honorarer udbetalt fra Danmark som B-indkomst, indkomst ved privat hushjælp (herunder ydelser, hvor køberen får servicefradrag),  værdien af medarbejderaktier og anparter samt tegnings- og køberetter til aktier og anparter modtaget som løn i et ansættelsesforhold eller af bestyrelsesmedlemmer, værdien af fri helårsbolig, fri sommerbolig og fri lystbåd til direktører, hovedaktionærer og andre med væsentlig indflydelse på egen aflønningsform og værdien af fri bil, fri helårsbolig, fri sommerbolig og fri lystbåd som udbytte til hovedaktionærer, der ikke er ansat i selskabet.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstHonorarEfterAMBidrag:
          description: Operationelt beregningsfelt, som indeholder PersonligIndkomstHonorar efter arbejdsmarkedsbidrag (AM-bidrag) er fratrukket.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstIndkomstVirksomhedsBeskatning:
          description: |-
            Beløb der udgør indkomst til beskatning efter reglerne i virksomhedsordningen (årets opsparede overskud tillagt virksomhedsskat)
            Beløbet skal omfatte:
            - Årets opsparede beløb tillagt virksomhedsskat.
            Rubrik: 149 Felt: 434
          type: number
          x-typeDescription: Beløb angivet som decimaltal, fx. 1500,00
        PersonligIndkomstJubilæumsGratialeFratrædelsesGodtgørelse:
          description: |-
            Felt 243: Jubilæumsgratiale og fratrædelsesgodtgørelse mv. før fradrag for AM-bidrag (Rubrik 14) (JUBGRA7UBLB)
            Beløbet i rubrikken består af
            - Jubilæumsgratialer
            - Fratrædelsesgodtgørelse
            - Kontante gaver fra din arbejdsgiver
            - Værdien af tingsgaver fra din arbejdsgiver
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstJubilæumsGratialeFratrædelsesGodtgørelseEfterAMBidrag:
          description: Operationelt beregningsfelt, som indeholder PersonligIndkomstJubilæumsGratialeFratrædelsesGodtgørelse efter arbejdsmarkedsbidrag (AM-bidrag) er fratrukket.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstKapitalafkastAktierAnparter:
          description: |-
            Felt 835: Kapitalafkast af aktier og anparter ved erhvervelse af virksomhed (SAEKAPAFKBLB)
            Fuldt skattepligtige hovedaktionærer kan i forbindelse med aktiekøb mm. ved virksomhedsovertagelse opgøre et særligt kapitalafkast, der fragår i den personlige indkomst og tillægges kapitalindkomsten, jf. VSL § 22 c.
            Beløb til denne særlige kapitalafkastberegning for aktier og anparter indberettes i felt 835 (rubrik 162 på "den udvidede selvangivelse").
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstLønIndkomst:
          description: |-
            Felt 202: Lønindkomst, fri telefon, bestyrelseshonorar, fri bil mv. før fradrag af AM-bidrag (rubrik 11) (LOEDAPPENSBLB)
            Beløb der udgør løn, tabt arbejdsfortjeneste og lign., herunder feriegodtgørelse og tilskud fra arbejdsgiver, værdi af fri bil (firmabil), fri kost og logi.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstLønIndkomstEfterAM:
          description: 'Transient element som er beregnet værdi af PersonligIndkomstLønIndkomst efter AM bidrag. '
          type: number
          x-typeDescription: Beløb angivet som decimaltal, fx. 1500,00
        PersonligIndkomstOverskudVirksomhedUdlejningEjendom:
          description: |-
            Beløb der udgør årets overskud af virksomhed renset for renteindtægter/-udgifter og andre former for kapitalindkomst.
            Rubrik: 111 Felt: 221
          type: number
          x-typeDescription: Beløb angivet som decimaltal, fx. 1500,00
        PersonligIndkomstOverskudVirksomhedUdlejningEjendomEfterAMBidrag:
          description: Beløb der udgør årets overskud af virksomhed før renteindtægter/-udgifter og andre former for kapitalindkomst og efter AM bidrag.
          type: number
          x-typeDescription: Beløb angivet som decimaltal, fx. 1500,00
        PersonligIndkomstPensionDagpengeStipendie:
          description: |-
            Felt 204: Pensioner, dagpenge mv. og stipendier fra SU-styrelsen (rubrik 16) (DAPEGPENSBLB)
            Beløb der udgør pensioner (folkepension, efterlevelsespension, førtidspension, livrente, efterløn, forsikringsydelser mv.), kontanthjælp, orlovsydelser, fleksydelse, udbetalinger fra A-kasser.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstPrivatDagplejeHushjælp:
          description: |-
            Felt 207: Anden personlig indkomst som fx privat dagpleje og hushjælp mv. før fradrag af AM-bidrag (rubrik 15) (HONORHUSHJABLB)
            Beløb der udgør indkomst ved privat dagpleje, vederlag fra foreninger på under 1.500 kr. for udført arbejde, værdien af visse uafdækkede pensionstilsagn og værdien af fri telefon.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstPrivatDagplejeHushjælpEfterAMBidrag:
          description: Operationelt beregningsfelt, som indeholder PersonligIndkomstPrivatDagplejeHushjælp efter arbejdsmarkedsbidrag (AM-bidrag) er fratrukket.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        PersonligIndkomstPrivatLivsvarigPensionsOrdning:
          description: |-
            Beløb der udgør:
            - Indbetalinger til private pensionsordninger med løbende udbetaling, der ikke er ophørende livrenter, når det indbetalte beløb er under 46.000 kroner (grundbeløb i 2010-niveau).
            - Indbetalinger til private indeksordninger.
            - Sportsudøveres indbetalinger på særlige, private ratepensionsordninger.
