    Aldersopsparing:
      x-entityname: Aldersopsparing
      x-ui-selectable: true
      properties:
        AlderspensionAfgiftsBeløb4Pct:
          description: Beløb med beregnet afgift ved indbetaling til aldersopsparing, hvor beløb er flyttet til anden ordning. Beløbet er beregnet med 4 % kr. af felt 983.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        AlderspensionAfgiftsBeløb20PctOver5År:
          description: Beløb med beregnet afgift ved indbetaling til aldersopsparing, hvor personen har mere end 5 år til pensionsalderen, og indskuddet overstiger grundbeløbet (beløbet reguleres årligt). Beløbet er beregnet med 20 % kr. af felt 982
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        AlderspensionAfgiftsBeløb20PctUnder6År:
          description: Beløb med beregnet afgift ved indbetaling til aldersopsparing, hvor personen har 5 år eller mindre til pensionsalderen, og indskuddet overstiger grundbeløbet (beløbet reguleres årligt). Beløbet er beregnet med 20 % kr. af felt 982 reduceret med grundbeløbet (beløbet reguleres årligt).
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        AlderspensionAfgiftsBeløb40PctDiskvalificeret:
          description: Beløb med beregnet afgift ved indbetaling til aldersopsparing, hvor personen er diskvalificeret for at indskyde høje beløb, og indskuddet overstiger grundbeløbet (beløbet reguleres årligt). Beløbet er beregnet med 40 % kr. af felt 982 reduceret med grundbeløbet (beløbet reguleres årligt).
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        AlderspensionAfgiftsberegning4Pct:
          description: |-
            Beløb til afgiftsberegning med 4%. Beløbet stammer fra indbetaling til aldersopsparing, hvor beløb er flyttet til anden ordning.
            Beløbet hentet fra Felt 983
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        AlderspensionAfgiftsberegning20PctOg40Pct:
          description: |-
            Beløb til afgiftsberegning med 20% eller 40%. Hvis indbetalingen overstiger grundbeløb, beregnes der en afgift med henholdsvis 20% eller 40% efter fradrag af grundbeløb.
            Beløbet hentes fra Felt 982
            Indbetalinger bliver diskvalificeret ved udbetaling fra anden pensionsordning, hvis udbetaling er påbegyndt inden for de sidste 10 år før folkepensionsalderen.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        AlderspensionDiskvalifikationKode:
          description: |-
            Felt 035: Kode for diskvalifikation (ALDOPSDISKVAKOD)
            Koden kan være blank, 1 eller 2.
            Koden angives med værdien 1, hvis personen bliver diskvalificeret ved udbetaling fra anden pensionsordning, når udbetaling er påbegyndt inden for de sidste 10 år før folkepensionsalderen.
            Koden angives med værdien 2, hvis der skal beregnes 40% i afgift af det beløb, som overstiger det lovmæssige regulerede lave grundbeløb (personskattelovens § 20). Dette kan tidligst ske for indkomståret 2020. For indkomståret 2019 er det lave grundbeløb 5.200 kr.
          type: string
          x-typeDescription: En kode bestående af en karakter.
