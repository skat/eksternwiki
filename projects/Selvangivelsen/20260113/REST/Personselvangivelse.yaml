        AktierSpecifikationUdbytteEjDkAktierEjMarked:
          description: "Beløb i rubrik 62 udgør udbytte fra danske aktier, der er optaget til handel på et reguleret marked og udlodning/udlodningsandele, der er aktieindkomst fra danske investeringsforeninger. Udbytte/udlodning med videre skal kun skrives i rubrik 62, når det ikke er medtaget i rubrik 61.\nAlle omsættelige investeringsforeningsbeviser anses for optaget til handel på et reguleret marked. Det gælder, uanset hvornår de er anskaffet.\nUdbytte af danske aktier optaget til handel på et reguleret marked, der ikke er i dansk depot.\nUdlodning/udlodningsandele, der er aktieindkomst fra danske minimumsudloddende og akkumulerende, omsættelige investeringsforeninger, der ikke er investeringsselskaber, og ikke er i dansk depot.\nUdbytter fra danske aktier optaget til handel på et reguleret marked og ovenstående typer af investeringsforeninger, når investeringsforeningsbeviset er omsætteligt, hvor der er flere end to ejere.\nRubrik: 62 Felt: 505 "
          type: number
