    Indberetter:
      x-entityname: Indberetter
      x-ui-selectable: true
      required:
      - VirksomhedSENummer
      properties:
        VirksomhedSENummer:
          description: 8-cifret nummer, der entydigt identificerer en registreret virksomhed i Skatteforvaltningens Erhvervssystem.
          type: string
          x-typeDescription: 8-cifret nummer, der entydigt identificerer en registreret virksomhed i Skatteforvaltningens Erhvervssystem.
          pattern: '[0-9]{8}'
    UdviklerSENummer:
      x-entityname: UdviklerSENummer
      x-ui-selectable: true
      required:
      - VirksomhedSENummer
      properties:
        VirksomhedSENummer:
          description: 8-cifret nummer, der entydigt identificerer en registreret virksomhed i Skatteforvaltningens Erhvervssystem.
          type: string
          x-typeDescription: 8-cifret nummer, der entydigt identificerer en registreret virksomhed i Skatteforvaltningens Erhvervssystem.
          pattern: '[0-9]{8}'
    Selvangivelse:
      x-entityname: Selvangivelse
      x-ui-selectable: true
      properties:
        BeløbsfeltListe:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/Beloebsfelt'
        PersonSelvangivelseVirksomhedOphør:
          description: |-
            Hvorvidt angiver er ophørt med selvstændig virksomhed (true=ophørt).
            Felt 131
          type: boolean
          x-typeDescription: |-
            Generel type for markeringer. Kan være:
            false
            true
        PersonSelvangivelseVirksomhedOphørTidligere:
          description: |-
            Hvorvidt angiver har en ikke-erhvervsmæssig virksomhed eller virksomheden er ophørt før indkomståret. Bemærk at der på papirblanketten i stedet skal angives ophørsår.
            Felt 134
          type: boolean
          x-typeDescription: |-
            Generel type for markeringer. Kan være:
            false
            true
        PersonSelvangivelseHenstandsbegæring:
          description: |-
            Hvorvidt der er indsendt begæring om henstand med betaling af skat og AM-bidrag af fortjeneste ved overdragelse af goodwill mv. mod vederlag som løbende ydelse
            Hvorvidt der er solgt ejendom med fordeling af beskatningen efter ejendomsavancebeskatningsloven § 6 D
            (true=ja).
            Felt 155
          type: boolean
          x-typeDescription: |-
            Generel type for markeringer. Kan være:
            false
            true
        PersonSelvangivelseBeskatningsordning:
          description: |
            Kode for valgt beskatningsordning, som fx kan være beskatning efter kapitalafkastordningen (kaldes også for virksomhedskode).
            Felt 184.
            Værdisæt:
            Blank = Ikke i virksomhedsordning eller kapitalafkastordning, ikke vekselerer.
            1 = Virksomhedsordning, ikke vekselerer.
            2 = Virksomhedsordning, vekselerer.
            3 = Ikke i virksomhedsordning eller kapitalafkastordning, vekselerer.
            4 = Kapitalafkastordning, ikke vekselerer.
            5 = Kapitalafkastordning, vekselerer.
            (Koderne 2, 3 og 5 kan ikke tilvælges via TastSelv).
          type: string
          x-typeDescription: Tekst med en længde på 0 eller 1 tegn.
        PersonSelvangivelseFradragHelårsomregning:
          description: |-
            Ved skattepligt til Danmark i en kortere periode end et år kan der vælges om der ønskes personfradrag kombineret med helårsomregning af delårsindkomst (True=Ja).
            Felt 722
          type: boolean
          x-typeDescription: |-
            Generel type for markeringer. Kan være:
            false
            true
        PersonSelvangivelseRevisorindberetning:
          description: |-
            Hvorvidt der ønskes skift fra S13/S15D til S10, hvilket indebærer oplysningspligt:
            1. Mulighed for skift til erhverv (borgeren kan blive feltlåst S10)
            2. Mulighed for at skifte til udland (borger kan blive ej feltlåst S10)
            3. Mulighed for at skifte til både erhverv og udland (borgeren kan blive ej feltlåst S10)
          type: string
          x-typeDescription: En vilkårlig kode på 10 tegn.
        PersonSelvangivelseÅbenS15D:
          description: |
            Hvorvidt der ønskes åbnet op for virksomhed/udland for S15D
            Man skal kun kunne angive tallet 3
            3. Mulighed for at åbne op for både virksomhed og udland for S15D
          type: string
          x-typeDescription: En vilkårlig kode på 10 tegn.
        PersonSelvangivelseEjendomsoplysningAccept:
          description: |-
            Hvorvidt angiver er enig i at ejendomsoplysningerne er korrekte (true=ja).
            Felt 129
          type: boolean
          x-typeDescription: |-
            Generel type for markeringer. Kan være:
            false
            true
        PersonSelvangivelseEjendomsoplysningSupplement:
          description: |-
            Hvorvidt angiver er uenig i at ejendomsoplysningerne er korrekt og derfor indsender korrigerede oplysninger om ejendomsværdiskat (true=ja).
            Felt 130
          type: boolean
          x-typeDescription: |-
            Generel type for markeringer. Kan være:
            false
            true
        ReguleretTabKontrakterKode:
          description: |
            I rubrik 87 felt 782 skal angives, om der ønsker at årets tab på aktiebaserede finansielle kontrakter skal anvendes i årets gevinst på aktier optaget til handel på et reguleret marked. Hvis man er gift, kan man vælge om tab kun skal bruges i egen gevinst på aktier eller om tabet skal overføres til ægtefælle, hvis man ikke selv kan bruge det.
            Værdisættet (felt 782 rubrik 87)
            Blank - Tab modregnes ikke.
            Markering i denne rubrik betyder, at tab på aktiebaserede finansielle kontrakter ikke bliver modregnet i gevinst på aktier optaget til handel på reguleret marked.
            1 -Tab modregnes i egen indkomst.
            Markering i denne rubrik betyder, at tab på aktiebaserede finansielle kontrakter kun bruges i egen gevinst på aktier optaget til handel på reguleret marked.
            2 -Tab modregnes i egen og ægtefælles indkomst.
            Markering i denne rubrik betyder, at tab på aktiebaserede finansielle kontrakter, som ikke brugers overføres til ægtefælle.
          type: string
          x-typeDescription: Tekst med en længde på 0 eller 1 tegn.
        SkattepligtigPersonIndtrædenDato:
          description: |-
            Felt 702: Skattepligtens indtræden (SKPLITRAEDTO)
            Dato for skattepligtens indtræden skal indberettes i felt 702, hvis skattepligten er indtrådt på et senere tidspunkt end den 1. januar i SLUT-året.
            Indberetningen skal have formen: DAG - MÅNED (f.eks. 2110 for 21. oktober).
          type: string
          format: date
          x-typeDescription: |
            Alle gyldige datoer i den danske kalender. Noteret år måned dag
            Formatet følger: YYYY-MM-DD
            Eksempel: 2020-09-15
        SkattepligtigPersonBemærkningIndtrædenDato:
          description: Bemærkning til dato for skattepligtens indtræden
          type: string
          x-typeDescription: Angiver en tekst på max. 255 karakterer.
        SkattepligtigPersonOphørDato:
          description: |-
            Felt 707: Skattepligtens ophør (SKPLOPHOEDTO)
            Dato for skattepligtens ophør skal indberettes i felt 707, hvis skattepligten er ophørt i SLUT-året.
            Indberetningen skal have formen: DAG - MÅNED (f.eks. 2110 for 21. oktober).
          type: string
          format: date
          x-typeDescription: |
            Alle gyldige datoer i den danske kalender. Noteret år måned dag
            Formatet følger: YYYY-MM-DD
