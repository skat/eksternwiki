        UdenlandskSkatUdbytteskat:
          description: |-
            Felt 539: Betalt udenlandsk udbytteskat (UDLAKTIESKATBLB)
            I felt 539 indberettes betalt udenlandsk udbytteskat (dog højst det beløb som en evt. DBO giver kildestaten ubetinget krav på; for meget indeholdt skat kan tilbagesøges i kildestaten, jf. i øvrigt vejledningen til felt 540).
