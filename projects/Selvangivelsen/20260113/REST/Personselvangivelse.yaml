      schema:
        type: string
        pattern: '[0-9]*'
    x-data-antal:
      description: Angiver hvor mange data elementer, der returneres i et returkode 200 svar
      schema:
        type: integer
  schemas:
    PersonSelvangivelseAPIOpretRequest:
      x-entityname: PersonSelvangivelseAPIOpretRequest
