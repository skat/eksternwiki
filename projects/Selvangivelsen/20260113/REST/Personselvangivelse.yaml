security:
- jwtBillet: [
    ]
paths:
  /personselvangivelseopret/{IndkomstÅr}:
    parameters:
    - name: x-transaktions-id
      in: header
      required: true
      description: Transaktions id er en universelt transaktionidentifikator der bruges til at spore en samlet handling på tværs af flere kald og systemer. Hvis en handling resultere i flere kald skal Transaktions id genbruges og hvis et kald finder sted grundet en handling i et andet system skal transaktions id fra den oprindelige handling bruges til videre kald. Transaktions id skal være en UUID version 4, jf. ietf RFC 4122 og skal kunne korreleres med logfiler fra det kaldende system for altid at kunne svare på hvem der er ansvarlig for den handling der har resulteret i kaldet.
      schema:
        type: string
        pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[4][0-9A-Fa-f]{3}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$
    - name: x-request-id
      in: header
      required: true
      description: Request id er et requestidentifikator der bruges til at spore et kald og tilhørende svar. Request id må modsat transaktions id ikke genbruges. Request id skal være en UUID version 4, jf. ietf RFC 4122.
      schema:
        type: string
        pattern: ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[4][0-9A-Fa-f]{3}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$
    - name: x-major-version
      in: header
      required: false
      description: Servicen versioneres med Semantisk versionering (Major), hvor kun Major versioner indeholder breaking changes til snitfladen. Som udgangspunkt er der kun adgang til den nyeste version af services på en et miljø og det er kunderne såvel som service udstillers opgave at finde fejl på de lavere miljøer før en ny release løftes til produktion. Specifikt for nye Major releases kan der aftales en paralleldrift hvor den gamle version kan tilgås ved at specificere x-major-version. Hvis der kaldes med en x-major-version som ikke er tilgængelig modtages en fejl. Når x-major-version ikke er udfyldt kaldes den nyeste version automatisk.
      schema:
        type: string
        pattern: '[0-9]*'
    post:
      summary: PersonSelvangivelseAPIOpret
      description: ''
      operationId: 1ed13777-ddc6-4343-884b-37b50b3b0cc1
      parameters:
      - name: IndkomstÅr
        in: path
        required: true
        description: Det år, hvor den indkomst, der er lagt til grund for skatteberegningen, er indtjent. (INDKAAR)
        schema:
          type: integer
          description: Et årstal. Gyldige værdier er 1700 - 9999
          minimum: 1700
          exclusiveMinimum: false
          maximum: 9999
          exclusiveMaximum: false
      - name: PersonCPRNummer
        in: query
        required: true
        description: CPR-nummer er et 10 cifret personnummer der entydigt identificerer en dansk person. (PNR)
        schema:
          type: string
          pattern: ((((0[1-9]|1[0-9]|2[0-9]|3[0-1])(01|03|05|07|08|10|12))|((0[1-9]|1[0-9]|2[0-9]|30)(04|06|09|11))|((0[1-9]|1[0-9]|2[0-9])(02)))[0-9]{6})|0000000000
          description: CPR-nummer er et 10 cifret personnummer der entydigt identificerer en dansk person.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/PersonSelvangivelseAPIOpretRequest'
      responses:
        '200':
          description: Forventet svar ved korrekt forespørgsel
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PersonSelvangivelseAPIOpretResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
                  links:
                    $ref: '#/components/schemas/Links'
          headers:
            x-transaktions-id:
              $ref: '#/components/headers/x-transaktions-id'
            x-request-id:
              $ref: '#/components/headers/x-request-id'
            x-major-version:
              $ref: '#/components/headers/x-major-version'
        '400':
          description: |
            Fejl i forspørgsel
            Mulige fejlkoder
            - 400.1 Manglende transaktion og/eller request id (håndteret i gateway).
            - 400.9 Major version specificeret i x-major-version er ikke tilgængelig.
            - 400.12 JWT ikke angivet (håndteret i gateway).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fejlsvar'
          headers:
            x-transaktions-id:
              $ref: '#/components/headers/x-transaktions-id'
            x-request-id:
              $ref: '#/components/headers/x-request-id'
            x-major-version:
              $ref: '#/components/headers/x-major-version'
        '401':
          description: |
            Identifikation fejlede
            Mulige fejlkoder
            - 401.1 Identifikation fejlede (håndteret i gateway).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fejlsvar'
          headers:
            x-transaktions-id:
              $ref: '#/components/headers/x-transaktions-id'
            x-request-id:
              $ref: '#/components/headers/x-request-id'
            x-major-version:
              $ref: '#/components/headers/x-major-version'
        '403':
          description: |
            Autorisation fejlede
            Mulige fejlkoder
            - 403.1 Der er ikke de nødvendige rettigheder til den givne handling (håndteret i gateway).
            - 403.12 JWT er ikke valid (håndteret i gateway).
            - 403.14 Aftale mangler regel om fuldmagtsgiver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fejlsvar'
          headers:
            x-transaktions-id:
              $ref: '#/components/headers/x-transaktions-id'
            x-request-id:
              $ref: '#/components/headers/x-request-id'
            x-major-version:
              $ref: '#/components/headers/x-major-version'
        '404':
          description: |
            Stien findes ikke
            Mulige fejlkoder
            - 404.1 Der findes ingen service for den angivne sti (håndteret i gateway).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fejlsvar'
          headers:
            x-transaktions-id:
              $ref: '#/components/headers/x-transaktions-id'
            x-request-id:
              $ref: '#/components/headers/x-request-id'
            x-major-version:
              $ref: '#/components/headers/x-major-version'
        '405':
          description: |
            Operationen er ikke tilladt
            Mulige fejlkoder
            - 405.1 Operationen kan ikke udføres på den angivne sti (håndteret i gateway).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fejlsvar'
          headers:
            x-transaktions-id:
              $ref: '#/components/headers/x-transaktions-id'
            x-request-id:
              $ref: '#/components/headers/x-request-id'
            x-major-version:
              $ref: '#/components/headers/x-major-version'
        '422':
          description: |
            Fejlkoder:
            - 422.1 Det er ikke muligt at danne årsopgørelse i SLUT
            - 422.2 Der er fejl i indrapporterede data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fejlsvar'
          headers:
            x-transaktions-id:
              $ref: '#/components/headers/x-transaktions-id'
            x-request-id:
              $ref: '#/components/headers/x-request-id'
            x-major-version:
              $ref: '#/components/headers/x-major-version'
        '500':
          description: |
            Ukendt server fejl
            Mulige fejlkoder
            - 500.1 Ukendt fejl.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fejlsvar'
          headers:
            x-transaktions-id:
              $ref: '#/components/headers/x-transaktions-id'
            x-request-id:
              $ref: '#/components/headers/x-request-id'
            x-major-version:
              $ref: '#/components/headers/x-major-version'
        '503':
          description: |
            Service utilgængelig
            Mulige fejlkoder
            - 503.1 Der er i øjeblikket ikke kontakt til datakilden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fejlsvar'
          headers:
            x-transaktions-id:
              $ref: '#/components/headers/x-transaktions-id'
            x-request-id:
              $ref: '#/components/headers/x-request-id'
            x-major-version:
              $ref: '#/components/headers/x-major-version'
        '504':
          description: |
            Gateway timeout
            Mulige fejlkoder
            - 504.1 Forespørgslen blev ikke færdig inden for det tilladte interval.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fejlsvar'
          headers:
            x-transaktions-id:
              $ref: '#/components/headers/x-transaktions-id'
            x-request-id:
              $ref: '#/components/headers/x-request-id'
            x-major-version:
              $ref: '#/components/headers/x-major-version'
components:
