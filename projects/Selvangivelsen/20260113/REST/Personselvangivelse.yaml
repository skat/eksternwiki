        ReguleretTabKontrakter:
          description: |-
            Felt 329: Tab på visse aktiebaserede finansielle kontrakter
            Feltet bruges til indberetning af samlet fradragsberettiget tab vedrørende aktiebaserede finansielle kon-trakter, der enten kan vælges at blive modregnet i gevinst på aktier, optaget til handel på reguleret marked eller fremført til senere indkomstår.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        ReguleretTabKontrakterKode:
          description: |
            I rubrik 87 felt 782 skal angives, om der ønsker at årets tab på aktiebaserede finansielle kontrakter skal anvendes i årets gevinst på aktier optaget til handel på et reguleret marked. Hvis man er gift, kan man vælge om tab kun skal bruges i egen gevinst på aktier eller om tabet skal overføres til ægtefælle, hvis man ikke selv kan bruge det.
            Værdisættet (felt 782 rubrik 87)
            Blank - Tab modregnes ikke.
            Markering i denne rubrik betyder, at tab på aktiebaserede finansielle kontrakter ikke bliver modregnet i gevinst på aktier optaget til handel på reguleret marked.
            1 -Tab modregnes i egen indkomst.
            Markering i denne rubrik betyder, at tab på aktiebaserede finansielle kontrakter kun bruges i egen gevinst på aktier optaget til handel på reguleret marked.
            2 -Tab modregnes i egen og ægtefælles indkomst.
            Markering i denne rubrik betyder, at tab på aktiebaserede finansielle kontrakter, som ikke brugers overføres til ægtefælle.
          type: string
          x-typeDescription: Tekst med en længde på 0 eller 1 tegn.
        FastEjendomTabBeløb:
          description: |-
            Felt 892: Samlet fradragsberettiget tab vedrørende indkomstårene 2002-2005 til fremførsel til senere indkomstår vedrørende afståelse af fast ejendom (TABFASTEJDBLB)
            I feltet 892 selvangives modregningsberettiget tab ved salg af fast ejendom, jf. ejendomsavancebeskatningslovens § 6, stk. 4.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        ReguleretTabKontrakterFremførsel:
          description: |
            Felt 893: Samlet frd.ber. tab vedr. 2002 og frem til fremførsel vedr. finans.kontr. og aft. (TABFINKTRBLB)
            Uudnyttet tab på aktiebaserede finansielle kontrakter
            TAB VED SALG AF VISSE FINANSIELLE KONTRAKTER
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        ReguleretUdbytteUdenlandsk:
          description: |-
            Felt 503: Udbytte af udenlandske aktier optaget til handel på et reguleret marked (UDLLEPAKTBLB)
            I felt 503 indberettes lempelsesberettiget udbytte af udenlandske aktier, der er optaget til handel på et reguleret marked, og som ikke er medtaget i felt 509, dvs. som ikke er i dansk depot. Beløbet skal være før indeholdelse af udenlandsk udbytteskat.
            I felt 503 medregnes indberettede udbytter fra udenlandske aktier i dansk depot, hvis der ikke er en DBO med landet med en fast procentsats (f.eks. Frankrig, Grønland, Kenya og Spanien).
            Felt 503 kan også bruges i tilfælde, hvor der er tale om anden udenlandsk aktieindkomst, hvis denne er lempelsesberettiget (som aktieindkomst) og vedrører aktier, der er optaget til handel på et reguleret marked.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        ReguleretGevinstUdenlandsk:
          description: |-
            Felt 504: Gevinst/tab på udenlandske aktier/investeringsforeningsbeviser optaget til handel på et reguleret marked (UDLANDAKTINDBLB)
            I felt 504 indberettes gevinst/tab på udenlandske aktier, der er optaget til handel på et reguleret marked.
            Beløb vedrørende felt 504 kommer fra selvangivelsen for udenlandsk indkomst (04.012).
            Tab indberettes med negativt fortegn.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        EjReguleretUdbytteUdenlandsk:
          description: |-
            Felt 313: Udbytte af udenlandske aktier, der ikke er optaget til handel på et reguleret marked og anden udlodning fra visse investeringsforeninger (Rubrik 450) (UDLLEPUNOAKTBLB)
            I felt 313 indberettes lempelsesberettiget udbytte af udenlandske aktier, der ikke er optaget til handel på et reguleret marked (og ikke i dansk depot).
            Beløbet skal være før indeholdelse af udenlandsk udbytteskat.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        EjReguleretGevinstUdenlandsk:
          description: |-
            Felt 314: Gevinst/tab på udenlandske aktier/investeringsforeningsbeviser, der ikke er optaget til handel på et reguleret marked (UDLANDUNOAKTBLB)
            I felt 314 indberettes gevinst/tab på udenlandske aktier, der ikke er optaget til handel på et reguleret marked, og udenlandsk udbytte/udlodning, hvor der ikke er indeholdt udbytteskat.
            Beløb vedrørende felt 314 kommer fra selvangivelsen for udenlandsk indkomst (04.012).
            Tab indberettes med negativt fortegn.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        AktierSpecifikationAktiebaseretInvesteringBeløb:
          description: |-
            Angiver nettogevinst eller -tab på danske aktier/beviser i aktiebaserede investeringsselskaber.
            I tilfælde af tab vises dette med minus.
            Der bruges ikke udtrykket reguleret marked eller ej reguleret marked om denne type værdipapirer.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        AktierSpecifikationUdenlandskAktiebaseretInvesteringBeløb:
          description: |-
            Angiver nettogevinst eller -tab på danske aktier/beviser i aktiebaserede investeringsselskaber.
            I tilfælde af tab vises dette med minus.
            Der bruges ikke udtrykket reguleret marked eller ej reguleret marked om denne type værdipapirer.
            Felt 375
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        AktierSpecifikationTabUdenlandskAktiebaseretInvesteringTilÆgtefælleBeløb:
          description: |-
            Angiver tab på aktier/beviser i aktiebaserede investeringsselskaber som er overført til ægtefælle.
            Der bruges ikke udtrykket reguleret marked eller ej reguleret marked om denne type værdipapirer.
            Benyttes på udenlandske og danske forhold.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
        AktierSpecifikationTabUdenlandskAktiebaseretInvesteringFraÆgtefælleBeløb:
          description: |-
            Angiver tab på aktier/beviser i aktiebaserede investeringsselskaber som er overført fra ægtefælle. Tab vises med minus.
            Der bruges ikke udtrykket reguleret marked eller ej reguleret marked om denne type værdipapirer.
            Benyttes på udenlandske og danske forhold.
          type: string
          pattern: ([\-\+]){0,1}([0-9]{0,3}[.]){0,1}([0-9]{3}[.]){0,4}[0-9]{1,3}([,][0-9]{1,2}){0,1}
